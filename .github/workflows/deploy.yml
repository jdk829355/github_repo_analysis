name: Deploy

on:
  push:
    branches: [main]

# 연속 push 시 배포가 겹치지 않도록 한 번에 하나만 실행한다.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jdk829355/github_repo_analysis

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Testcontainers가 러너의 Docker로 Postgres를 띄운다.
      - name: Test
        run: ./gradlew test

  build:
    needs: test
    # 배포 서버가 ARM64라서 ARM 러너에서 네이티브로 빌드한다.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            git config --global --add safe.directory /home/jdk829355/github_repo_analysis
            set -e
            cd /home/jdk829355/github_repo_analysis
            git pull origin main
            # 서비스 이름이 바뀌면(next-app → app) 예전 컨테이너가 포트를 쥔 채 남으므로 --remove-orphans로 지운다.
            docker compose --project-directory . -f deploy/docker-compose.yml pull
            docker compose --project-directory . -f deploy/docker-compose.yml up -d --remove-orphans
            docker image prune -f
          EOF