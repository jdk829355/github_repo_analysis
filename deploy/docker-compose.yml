# 저장소 루트에서 `docker compose --project-directory . -f deploy/docker-compose.yml`로 실행한다.
# 그래야 프로젝트 이름(github_repo_analysis)과 변수 파일(루트의 .env)이 예전과 같다.

# 컨테이너 로그가 디스크를 채우지 않도록 서비스마다 최대 30MB만 보관한다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    # CI가 GHCR에 올린 이미지를 쓴다. 롤백은 IMAGE_TAG=<커밋 SHA>로 지정한다.
    image: ghcr.io/jdk829355/github_repo_analysis:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    # 서버 커널에 메모리 cgroup이 없어서 지금은 적용되지 않는다(배포 로그의 "Limitation discarded").
    # 힙 상한은 Dockerfile의 -Xmx700m가 정한다.
    mem_limit: 1g
    ports:
      - "3000:8080"
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}

  alloy:
    # Docker 소켓에 접근하는 컨테이너는 사실상 호스트 권한이 있으므로 공식 이미지를 버전까지 고정한다.
    image: grafana/alloy:v1.21.3
    restart: unless-stopped
    logging: *default-logging
    # 메트릭의 instance 레이블이 된다. 없으면 컨테이너를 다시 만들 때마다 값이 바뀌어 시계열이 끊긴다.
    hostname: pinned-signal
    # 읽은 위치를 볼륨에 남겨 재시작해도 로그를 다시 보내지 않는다.
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    # config.alloy만 바꾸면 배포해도 반영되지 않는다. 서버에서 `up -d --force-recreate alloy`를 실행한다.
    volumes:
      - ./deploy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      # Docker 소켓과, cAdvisor가 컨테이너를 찾을 때 쓰는 containerd 소켓이 있다.
      - /var/run:/var/run:ro
      # 서버·컨테이너 메트릭을 읽는 호스트 경로.
      - /:/rootfs:ro
      - /proc:/host/proc:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    environment:
      - GRAFANA_LOKI_URL=${GRAFANA_LOKI_URL}
      - GRAFANA_LOKI_USER=${GRAFANA_LOKI_USER}
      - GRAFANA_PROM_URL=${GRAFANA_PROM_URL}
      - GRAFANA_PROM_USER=${GRAFANA_PROM_USER}
      - GRAFANA_CLOUD_TOKEN=${GRAFANA_CLOUD_TOKEN}

volumes:
  alloy-data:
