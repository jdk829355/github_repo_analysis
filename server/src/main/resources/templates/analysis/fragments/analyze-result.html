<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 분석 요청이 실패했을 때 폼 아래에 들어가는 문구. 모델: message -->
<p th:fragment="error" th:text="${message}"
   class="text-center text-sm font-medium text-[#ba1a1a]"></p>

<!-- 검증용 저장소에 star가 없을 때. 모델: username, profileUrl, verificationRepoUrl, stillMissing -->
<th:block th:fragment="starRequired">
  <p th:if="${stillMissing}"
     class="mb-4 text-center text-sm font-medium text-[#ba1a1a]">
    아직 star가 확인되지 않았습니다. star를 남긴 뒤 다시 시도해주세요.
  </p>
  <div class="rounded-xl border border-[#c1c6d5] bg-white p-5 text-left shadow-sm">
    <div class="flex flex-col gap-4 md:flex-row md:items-start md:justify-between">
      <div class="space-y-2">
        <p class="text-sm font-semibold leading-5 text-[#181c22]">분석 전 계정 소유 여부를 확인합니다</p>
        <p class="text-sm leading-6 text-[#414753]">
          <span class="font-semibold text-[#181c22]" th:text="${username}">username</span> 계정으로
          <a th:href="${verificationRepoUrl}" target="_blank" rel="noreferrer"
             class="font-semibold text-[#005ab4] underline-offset-4 hover:underline">github_repo_analysis</a>에
          star를 남긴 뒤 검증을 진행하세요. star 목록에서 해당 계정이 확인되면 분석이 시작됩니다.
        </p>
      </div>
      <form hx-post="/analyze" hx-target="#analyze-result" hx-swap="innerHTML" hx-disabled-elt="find button" class="group">
        <input type="hidden" name="url" th:value="${profileUrl}">
        <input type="hidden" name="confirm" value="true">
        <button type="submit"
                class="inline-flex min-h-11 shrink-0 items-center justify-center gap-2 rounded-lg bg-[#181c22] px-5 py-3 text-xs font-semibold uppercase tracking-[0.5px] text-white transition-colors hover:bg-[#2f3540] focus:outline-none focus:ring-2 focus:ring-[#181c22] focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60">
          <span class="flex items-center gap-2 group-[.htmx-request]:hidden">
            <span>검증 후 분석</span>
            <svg class="h-[18px] w-[18px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4M12 3a9 9 0 100 18 9 9 0 000-18z" />
            </svg>
          </span>
          <span class="hidden h-4 w-4 animate-spin rounded-full border-2 border-white/30 border-t-white group-[.htmx-request]:block"></span>
        </button>
      </form>
    </div>
  </div>
</th:block>
</body>
</html>
