  <g font-family="Inter, Arial, sans-serif">
    <text x="36" y="132" font-size="15" font-weight="400" fill="#414753">Builds &lt;fast&gt; &amp; &quot;safe&quot; tools that don&apos;t break. It is written in plain</text><text x="36" y="156" font-size="15" font-weight="400" fill="#414753">English so that the line wrapping is exercised at the seventy</text><text x="36" y="180" font-size="15" font-weight="400" fill="#414753">character limit, and it keeps going on and on until the third line...</text>
