<?xml version="1.0" encoding="UTF-8"?>
<svg width="613" height="431" viewBox="0 0 876 616" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" data-widget-version="inner-card-v4">
  <title id="title">Pinned Signal GitHub profile analysis widget</title>
  <desc id="desc">A GitHub profile analysis summary with green flags and growth areas.</desc>
  <rect x="0.5" y="0.5" width="875" height="615" rx="22" fill="#0D1117" stroke="#30363D"/>
  <text x="36" y="46" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5" fill="#58A6FF">PINNED SIGNAL</text>
  <text x="36" y="90" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#F4F7FB">@ octocat</text>
  <rect x="692" y="36" width="126" height="34" rx="17" fill="#58A6FF"/>
  <text x="755" y="58" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#07111F">7 pinned repos</text>
  <g font-family="Inter, Arial, sans-serif">
    <text x="36" y="132" font-size="15" font-weight="400" fill="#D5DCE7">백엔드 API 설계와 데이터 모델링에 강점이 있는 개발자입니다. Spring Boot와 PostgreSQL로 여러 서비스를</text><text x="36" y="156" font-size="15" font-weight="400" fill="#D5DCE7">직접 운영했고, 배포 자동화와 모니터링까지 맡아 왔습니다. 팀 프로젝트에서는 코드 리뷰와 문서화를 주도했습니다. 최근에는</text><text x="36" y="180" font-size="15" font-weight="400" fill="#D5DCE7">LLM을 서비스에 붙이는 작업에 관심을 두고 있습니다.</text>
  </g>
  <rect x="36" y="210" width="112" height="36" rx="18" fill="#58A6FF"/>
  <text x="92" y="233" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#07111F">Backend</text>
  <text x="168" y="233" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#9AA6B6">Java · TypeScript · Go · Python</text>
  <text x="60" y="332" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#58A6FF">Green Flags</text>
  <g font-family="Inter, Arial, sans-serif">
    <circle cx="64" cy="366" r="4" fill="#58A6FF" /><text x="80" y="370" font-size="14" font-weight="400" fill="#D5DCE7">커밋 메시지가 일관되고 변경 이유가 분명하게 적혀</text><text x="80" y="389" font-size="14" font-weight="400" fill="#D5DCE7">있습니다.</text><circle cx="64" cy="424" r="4" fill="#58A6FF" /><text x="80" y="428" font-size="14" font-weight="400" fill="#D5DCE7">테스트 코드를 기능과 함께 꾸준히 추가합니다.</text><circle cx="64" cy="482" r="4" fill="#58A6FF" /><text x="80" y="486" font-size="14" font-weight="400" fill="#D5DCE7">README에 실행 방법과 설계 결정이 정리되어</text><text x="80" y="505" font-size="14" font-weight="400" fill="#D5DCE7">있습니다.</text>
  </g>
  <text x="482" y="332" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#58A6FF">Growth Areas</text>
  <g font-family="Inter, Arial, sans-serif">
    <circle cx="486" cy="366" r="4" fill="#58A6FF" /><text x="502" y="370" font-size="14" font-weight="400" fill="#D5DCE7">프론트엔드 경험을 보여주는 저장소가 없습니다.</text><circle cx="486" cy="424" r="4" fill="#58A6FF" /><text x="502" y="428" font-size="14" font-weight="400" fill="#D5DCE7">대형 저장소에서 기여한 흔적이 적습니다.</text>
  </g>
  <text x="36" y="590" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#9AA6B6">Generated by Pinned Signal</text>
</svg>