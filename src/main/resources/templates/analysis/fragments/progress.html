<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  진행 상황 조각. 첫 화면과 polling 응답이 같이 쓴다. 모델: progress(AnalysisProgressResponse)
  진행 중이면 바깥 div가 2초마다 자기 자신을 다시 받아 간다. 실패하면 polling 속성이 없는 카드만 나가서 멈춘다.
-->
<th:block th:fragment="progress">

  <!-- 실패 -->
  <div th:if="${progress.failed()}"
       class="space-y-5 rounded-xl border border-[#c1c6d5] bg-white p-8 text-center shadow-sm">
    <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-[#ffdad6]">
      <svg class="h-8 w-8 text-[#ba1a1a]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>
    <div>
      <h2 class="text-2xl font-semibold leading-8 text-[#181c22]">분석 실패</h2>
      <p class="mt-2 text-sm leading-5 text-[#414753]" th:text="${progress.failureMessage()}">분석에 실패했습니다</p>
    </div>
    <!-- 같은 프로필로 새 요청을 보낸다. 실패한 작업은 진행 중이 아니므로 새 작업이 만들어진다. -->
    <form hx-post="/analyze" hx-target="#analyze-result" hx-swap="innerHTML" hx-disabled-elt="find button">
      <input type="hidden" name="url" th:value="${progress.githubProfile()}">
      <button type="submit"
              class="mt-2 rounded-lg bg-[#005ab4] px-6 py-3 text-xs font-semibold uppercase tracking-[0.5px] text-white transition-colors hover:bg-[#0a73e0] disabled:cursor-not-allowed disabled:opacity-60">
        다시 시도
      </button>
    </form>
    <div id="analyze-result"></div>
  </div>

  <!-- 진행 중 -->
  <div th:unless="${progress.failed()}" id="analysis-progress"
       th:hx-get="@{/analysis/{jobId}/progress(jobId=${progress.jobId()})}"
       hx-trigger="every 2s" hx-swap="outerHTML"
       hx-on::before-swap="if (event.detail.xhr.status >= 500) event.detail.shouldSwap = false">
    <div class="mb-6">
      <div class="mb-2 flex items-end justify-between">
        <span class="text-xs font-semibold uppercase tracking-[0.5px] text-[#414753]">Progress</span>
        <span class="text-xs font-semibold uppercase tracking-[0.5px] text-[#414753]">
          <span th:text="${progress.finishedRepos()}">0</span> /
          <span th:text="${progress.totalRepos() > 0} ? ${progress.totalRepos()} : '?'">?</span>
        </span>
      </div>
      <div class="h-2 w-full overflow-hidden rounded-full bg-[#e0e2eb]">
        <div id="progress-bar" class="h-full rounded-full bg-[#005ab4] transition-all duration-500"
             th:style="|width: ${progress.percent()}%|"></div>
      </div>
    </div>

    <div class="overflow-hidden rounded-xl border border-[#c1c6d5] bg-white shadow-sm">
      <ul class="flex flex-col divide-y divide-[#c1c6d5]">

        <li th:if="${progress.pending()}" class="flex items-center gap-4 p-4">
          <span class="h-5 w-5 animate-spin rounded-full border-2 border-[#c1c6d5] border-t-[#005ab4]"></span>
          <span class="flex-1 text-sm leading-5 text-[#181c22]">시작 대기 중...</span>
          <span class="text-xs font-semibold uppercase tracking-[0.5px] text-[#717785]">Pending</span>
        </li>

        <li th:if="${progress.loadingRepos()}" class="flex items-center gap-4 p-4">
          <span class="h-5 w-5 animate-spin rounded-full border-2 border-[#c1c6d5] border-t-[#005ab4]"></span>
          <span class="flex-1 text-sm leading-5 text-[#181c22]">저장소 목록을 불러오는 중...</span>
          <span class="text-xs font-semibold uppercase tracking-[0.5px] text-[#005ab4]">Analyzing</span>
        </li>

        <li th:each="repo : ${progress.repos()}" th:switch="${repo.status().name()}"
            class="flex items-start gap-4 p-4"
            th:classappend="${repo.status().name() == 'COMPLETED'} ? 'bg-[#f1f3fc]/50' : (${repo.status().name() == 'PENDING'} ? 'opacity-60' : '')">

          <th:block th:case="'COMPLETED'">
            <span class="text-[#005ab4]">✓</span>
            <div class="min-w-0 flex-1">
              <p class="truncate text-sm leading-5 text-[#181c22]" th:text="${repo.name()}">repo</p>
              <p th:if="${repo.summary() != null}" class="mt-1 line-clamp-2 text-xs leading-5 text-[#717785]"
                 th:text="${repo.summary()}"></p>
            </div>
            <span class="text-xs font-semibold uppercase tracking-[0.5px] text-[#717785]">Complete</span>
          </th:block>

          <th:block th:case="'FAILED'">
            <span class="text-[#ba1a1a]">!</span>
            <div class="min-w-0 flex-1">
              <p class="truncate text-sm leading-5 text-[#181c22]" th:text="${repo.name()}">repo</p>
              <p th:if="${repo.errorMessage() != null}" class="mt-1 text-xs leading-5 text-[#ba1a1a]"
                 th:text="${repo.errorMessage()}"></p>
            </div>
            <span class="text-xs font-semibold uppercase tracking-[0.5px] text-[#717785]">Failed</span>
          </th:block>

          <th:block th:case="'SKIPPED'">
            <span class="text-[#717785]">–</span>
            <div class="min-w-0 flex-1">
              <p class="truncate text-sm leading-5 text-[#181c22]" th:text="${repo.name()}">repo</p>
              <p class="mt-1 text-xs leading-5 text-[#717785]">분석할 커밋이 없어 건너뛰었습니다.</p>
            </div>
            <span class="text-xs font-semibold uppercase tracking-[0.5px] text-[#717785]">Skipped</span>
          </th:block>

          <th:block th:case="'ANALYZING'">
            <span class="mt-0.5 h-5 w-5 animate-spin rounded-full border-2 border-[#c1c6d5] border-t-[#005ab4]"></span>
            <span class="min-w-0 flex-1 truncate text-sm font-medium leading-5 text-[#181c22]" th:text="${repo.name()}">repo</span>
            <span class="text-xs font-semibold uppercase tracking-[0.5px] text-[#005ab4]">Analyzing</span>
          </th:block>

          <th:block th:case="*">
            <span class="text-[#c1c6d5]">○</span>
            <span class="min-w-0 flex-1 truncate text-sm leading-5 text-[#414753]" th:text="${repo.name()}">repo</span>
            <span class="text-xs font-semibold uppercase tracking-[0.5px] text-[#c1c6d5]">Pending</span>
          </th:block>
        </li>

        <li th:if="${progress.aggregating()}" class="flex items-center gap-4 p-4">
          <span class="h-5 w-5 animate-spin rounded-full border-2 border-[#c1c6d5] border-t-[#005ab4]"></span>
          <span class="flex-1 text-sm font-medium leading-5 text-[#181c22]">프로필을 종합하는 중...</span>
          <span class="text-xs font-semibold uppercase tracking-[0.5px] text-[#005ab4]">Analyzing</span>
        </li>
      </ul>
    </div>
  </div>
</th:block>
</body>
</html>
